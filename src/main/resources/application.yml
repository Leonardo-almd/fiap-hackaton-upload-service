spring:
  application:
    name: upload-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/upload_db}
    username: ${SPRING_DATASOURCE_USERNAME:upload_user}
    password: ${SPRING_DATASOURCE_PASSWORD:upload_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

aws:
  region: ${AWS_REGION:us-east-1}
  endpoint-override: ${AWS_ENDPOINT_OVERRIDE:}
  s3:
    bucket-name: ${S3_BUCKET_NAME:fiap-diagrams}
  sqs:
    queue-url: ${SQS_QUEUE_URL:http://localhost:4566/000000000000/diagram-analysis}

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","service":"upload-service","traceId":"%X{traceId}","jobId":"%X{jobId}","message":"%msg"}%n'
  level:
    br.com.fiap: INFO
    org.springframework: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
