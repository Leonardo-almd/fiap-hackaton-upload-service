name: CD — upload-service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: upload-service
  SERVICE_NAME: upload-service

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Extract version from POM
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "image_tag=$VERSION" >> $GITHUB_OUTPUT

      - name: CD Prepare Summary
        if: always()
        run: |
          {
            echo "## CD Summary - Prepare"
            echo
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Version | ${{ steps.version.outputs.image_tag }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Build and Publish Image
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: publish_image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: CD Publish Summary
        if: always()
        run: |
          {
            echo "## CD Summary - Publish"
            echo
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Image | ${{ steps.publish_image.outputs.image_uri }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  update-terraform:
    name: Update Terraform Cloud
    runs-on: ubuntu-latest
    needs: [prepare, publish]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve ECR registry
        id: registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "registry=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Update Terraform Cloud variable
        id: tfc_update
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
          TFC_WORKSPACE_ID: ${{ secrets.TFC_WORKSPACE_ID }}
          TFC_VAR_ID: ${{ secrets.TFC_UPLOAD_VAR_ID }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          REGISTRY: ${{ steps.registry.outputs.registry }}
        run: |
          IMAGE_URI=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          curl -sS \
            -H "Authorization: Bearer $TFC_TOKEN" \
            -H "Content-Type: application/vnd.api+json" \
            -X PATCH \
            https://app.terraform.io/api/v2/workspaces/$TFC_WORKSPACE_ID/vars/$TFC_VAR_ID \
            -d '{"data":{"id":"'$TFC_VAR_ID'","type":"vars","attributes":{"value":"'$IMAGE_URI'"}}}'
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Trigger Terraform Cloud run
        id: tfc_run
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
          TFC_WORKSPACE_ID: ${{ secrets.TFC_WORKSPACE_ID }}
        run: |
          curl -sS \
            -H "Authorization: Bearer $TFC_TOKEN" \
            -H "Content-Type: application/vnd.api+json" \
            -X POST \
            https://app.terraform.io/api/v2/runs \
            -d '{"data":{"type":"runs","attributes":{"message":"CD update for upload-service"},"relationships":{"workspace":{"data":{"type":"workspaces","id":"'$TFC_WORKSPACE_ID'"}}}}}'

      - name: CD Terraform Summary
        if: always()
        run: |
          {
            echo "## CD Summary - Terraform"
            echo
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Image | ${{ steps.tfc_update.outputs.image_uri }} |"
            echo "| Workspace | ${{ secrets.TFC_WORKSPACE_ID }} |"
          } >> "$GITHUB_STEP_SUMMARY"
